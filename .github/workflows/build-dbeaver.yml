name: Build DBeaver 21.0.0 (UOS 20)

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '.github/workflows/build-dbeaver.yml'
      - 'scripts/**'
      - 'debian/**'
      - 'checksums/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/build-dbeaver.yml'
      - 'scripts/**'
      - 'debian/**'
      - 'checksums/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      architectures:
        description: 目标架构
        type: choice
        options:
          - both
          - amd64
          - arm64
        default: both
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBEAVER_VERSION: '21.0.0'
  TEMURIN_RELEASE: '11.0.32.1+1'
  MAX_GLIBC: '2.28'

jobs:
  configure:
    name: Configure architecture matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Select architectures
        id: matrix
        env:
          SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.architectures || 'both' }}
        run: |
          case "$SELECTED" in
            both)
              value='{"include":[{"deb_arch":"amd64","db_arch":"x86_64","runner":"ubuntu-22.04"},{"deb_arch":"arm64","db_arch":"aarch64","runner":"ubuntu-22.04-arm"}]}'
              ;;
            amd64)
              value='{"include":[{"deb_arch":"amd64","db_arch":"x86_64","runner":"ubuntu-22.04"}]}'
              ;;
            arm64)
              value='{"include":[{"deb_arch":"arm64","db_arch":"aarch64","runner":"ubuntu-22.04-arm"}]}'
              ;;
            *) echo "Unsupported architecture selection: $SELECTED" >&2; exit 2 ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.deb_arch }}
    needs: configure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install packaging tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl dpkg-dev file binutils

      - name: Fetch pinned upstream packages and stage DBeaver
        env:
          WORK_DIR: ${{ runner.temp }}/dbeaver-build
          OUTPUT_DIR: ${{ github.workspace }}/output
        run: |
          set -eu
          chmod +x scripts/fetch-and-stage.sh scripts/package-deb.sh
          bash scripts/fetch-and-stage.sh "${{ matrix.deb_arch }}"
          bash scripts/package-deb.sh \
            "output/dbeaver-ce-${DBEAVER_VERSION}-linux-gtk-${{ matrix.db_arch }}.tar.gz" \
            output

      - name: Verify package metadata and payload
        id: meta
        run: |
          set -eu
          deb="output/dbeaver-ce_${DBEAVER_VERSION}_${{ matrix.deb_arch }}.deb"
          tarball="output/dbeaver-ce-${DBEAVER_VERSION}-linux-gtk-${{ matrix.db_arch }}.tar.gz"
          test -f "$deb" && test -f "$tarball"
          test "$(dpkg-deb -f "$deb" Package)" = dbeaver-ce
          test "$(dpkg-deb -f "$deb" Version)" = "$DBEAVER_VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          file_list="$(mktemp)"
          dpkg-deb --contents "$deb" > "$file_list"
          grep -qE '^[^[:space:]]+[[:space:]].*[[:space:]]\./opt/dbeaver/dbeaver$' "$file_list"
          grep -qE '^[^[:space:]]+[[:space:]].*[[:space:]]\./opt/dbeaver/jre/bin/java$' "$file_list"
          grep -qE '^[^[:space:]]+[[:space:]].*[[:space:]]\./usr/bin/dbeaver$' "$file_list"
          tar_list="$(mktemp)"
          tar -tzf "$tarball" > "$tar_list"
          grep -qx 'dbeaver/dbeaver' "$tar_list"
          grep -qx 'dbeaver/jre/bin/java' "$tar_list"
          deb_name="$(basename "$deb")"
          tarball_name="$(basename "$tarball")"
          (
            cd output
            sha256sum "$deb_name" > "$deb_name.sha256"
            sha256sum "$tarball_name" > "$tarball_name.sha256"
          )
          echo "version=$DBEAVER_VERSION" >> "$GITHUB_OUTPUT"
          ls -lh output

      - uses: actions/upload-artifact@v7
        with:
          name: dbeaver-ce-${{ env.DBEAVER_VERSION }}-${{ matrix.deb_arch }}
          path: |
            output/dbeaver-ce_${{ env.DBEAVER_VERSION }}_${{ matrix.deb_arch }}.deb
            output/dbeaver-ce_${{ env.DBEAVER_VERSION }}_${{ matrix.deb_arch }}.deb.sha256
            output/*.tar.gz
            output/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-uos20:
    name: Verify on Debian 10 / ${{ matrix.deb_arch }}
    needs: [configure, build]
    runs-on: ${{ matrix.runner }}
    container: debian:10-slim
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}

    steps:
      - name: Configure archived Debian 10 repositories
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          printf '%s\n' \
            'deb http://archive.debian.org/debian buster main' \
            'deb http://archive.debian.org/debian-security buster/updates main' \
            > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' \
            > /etc/apt/apt.conf.d/99archive
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends ca-certificates file
          test "$(dpkg --print-architecture)" = "${{ matrix.deb_arch }}"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc $MAX_GLIBC"

      - uses: actions/download-artifact@v7
        with:
          name: dbeaver-ce-${{ env.DBEAVER_VERSION }}-${{ matrix.deb_arch }}
          path: dist

      - name: Install package and verify runtime links
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          cd dist
          deb="dbeaver-ce_${DBEAVER_VERSION}_${{ matrix.deb_arch }}.deb"
          sha256sum --check "$deb.sha256"
          apt-get install -y --no-install-recommends "./$deb"

          test "$(dpkg --print-architecture)" = "${{ matrix.deb_arch }}"
          test -x /opt/dbeaver/dbeaver
          test -x /opt/dbeaver/jre/bin/java
          test -x /usr/bin/dbeaver
          test -f /usr/share/applications/dbeaver.desktop
          /opt/dbeaver/jre/bin/java -version

          # DBeaver 本身是 GUI，不在无 X server 的 CI 里启动；但检查所有 ELF
          # 启动器和 JNI 库，确保在 UOS 20 ABI 基线没有未解析的共享库。
          missing=0
          while IFS= read -r -d '' elf; do
            description="$(file "$elf")"
            if [[ "$description" == *ELF* ]]; then
              links_file="$(mktemp)"
              if ! ldd "$elf" > "$links_file" 2>&1; then
                echo "ldd failed for $elf" >&2
                cat "$links_file" >&2
                rm -f "$links_file"
                missing=1
                continue
              fi
              if grep -Eq "not found|undefined symbol|version [^ ]+ not found" "$links_file"; then
                echo "Unresolved dependencies, symbols, or symbol versions in $elf" >&2
                cat "$links_file" >&2
                missing=1
              fi
              rm -f "$links_file"
            fi
          done < <(find /opt/dbeaver -type f -print0)
          test "$missing" -eq 0

          grep -F 'Exec=/usr/bin/dbeaver %u' /usr/share/applications/dbeaver.desktop
          grep -F '/opt/dbeaver/jre/bin/java' /usr/bin/dbeaver
          dpkg-query -W -f='Status Architecture Version\n' dbeaver-ce
          cat /opt/dbeaver/BUILD-ENVIRONMENT.txt

  release:
    name: Publish GitHub Release
    needs: [build, verify-uos20]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Guard version tag
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          test "$tag" = "v${DBEAVER_VERSION}" || {
            echo "Tag $tag does not match DBeaver ${DBEAVER_VERSION}." >&2
            exit 1
          }

      - uses: actions/download-artifact@v7
        with:
          pattern: dbeaver-ce-${{ env.DBEAVER_VERSION }}-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ls -lh dist
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "DBeaver CE ${DBEAVER_VERSION}" \
              --notes "DBeaver CE ${DBEAVER_VERSION} for UOS 20 / Debian 10 ABI.

            Includes amd64 and arm64 packages, a bundled pinned Temurin 11 JRE,
            SHA-256 files, and Debian 10 runtime verification."
          fi

  summary:
    name: Build summary
    needs: [build, verify-uos20]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## DBeaver ${DBEAVER_VERSION}"
            echo
            echo '| 项目 | 结果 |'
            echo '| --- | --- |'
            echo '| 双架构装配 | ${{ needs.build.result }} |'
            echo '| Debian 10 / UOS 20 ABI 验证 | ${{ needs.verify-uos20.result }} |'
            echo '| 输入 | 官方 nojdk 包 + 固定 Temurin 11 JRE（均校验 SHA-256） |'
          } >> "$GITHUB_STEP_SUMMARY"
