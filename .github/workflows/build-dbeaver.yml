name: Build DBeaver 21.0.0 ARM64 (UOS 20 ABI target)

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '.github/workflows/build-dbeaver.yml'
      - 'scripts/**'
      - 'debian/**'
      - 'checksums/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/build-dbeaver.yml'
      - 'scripts/**'
      - 'debian/**'
      - 'checksums/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBEAVER_VERSION: '21.0.0'
  TEMURIN_RELEASE: '11.0.32.1+1'
  MAX_GLIBC: '2.28'
  MAX_GLIBCXX: '3.4.25'

jobs:
  build:
    name: Package arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install packaging tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl dpkg-dev file binutils

      - name: Fetch pinned upstream packages and stage DBeaver
        env:
          WORK_DIR: ${{ runner.temp }}/dbeaver-build
          OUTPUT_DIR: ${{ github.workspace }}/output
        run: |
          set -eu
          chmod +x scripts/fetch-and-stage.sh scripts/package-deb.sh
          bash scripts/fetch-and-stage.sh arm64
          bash scripts/package-deb.sh \
            "output/dbeaver-ce-${DBEAVER_VERSION}-linux-gtk-aarch64.tar.gz" \
            output

      - name: Verify package metadata and payload
        id: meta
        run: |
          set -eu
          deb="output/dbeaver-ce_${DBEAVER_VERSION}_arm64.deb"
          tarball="output/dbeaver-ce-${DBEAVER_VERSION}-linux-gtk-aarch64.tar.gz"
          test -f "$deb" && test -f "$tarball"
          test "$(dpkg-deb -f "$deb" Package)" = dbeaver-ce
          test "$(dpkg-deb -f "$deb" Version)" = "$DBEAVER_VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = arm64
          archive_members="$(ar t "$deb")"
          printf '%s\n' "$archive_members" | grep -qx 'control.tar.gz'
          printf '%s\n' "$archive_members" | grep -qx 'data.tar.gz'
          file_list="$(mktemp)"
          dpkg-deb --contents "$deb" > "$file_list"
          grep -qE '^[^[:space:]]+[[:space:]].*[[:space:]]\./opt/dbeaver/dbeaver$' "$file_list"
          grep -qE '^[^[:space:]]+[[:space:]].*[[:space:]]\./opt/dbeaver/jre/bin/java$' "$file_list"
          grep -qE '^[^[:space:]]+[[:space:]].*[[:space:]]\./usr/bin/dbeaver$' "$file_list"
          tar_list="$(mktemp)"
          tar -tzf "$tarball" > "$tar_list"
          grep -qx 'dbeaver/dbeaver' "$tar_list"
          grep -qx 'dbeaver/jre/bin/java' "$tar_list"
          deb_name="$(basename "$deb")"
          tarball_name="$(basename "$tarball")"
          (
            cd output
            sha256sum "$deb_name" > "$deb_name.sha256"
            sha256sum "$tarball_name" > "$tarball_name.sha256"
          )
          echo "version=$DBEAVER_VERSION" >> "$GITHUB_OUTPUT"
          ls -lh output

      - uses: actions/upload-artifact@v7
        with:
          name: dbeaver-ce-${{ env.DBEAVER_VERSION }}-arm64
          path: |
            output/dbeaver-ce_${{ env.DBEAVER_VERSION }}_arm64.deb
            output/dbeaver-ce_${{ env.DBEAVER_VERSION }}_arm64.deb.sha256
            output/*.tar.gz
            output/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # 这是 Ubuntu 20.04 用户态的包安装与动态链接冒烟检查，不是 UOS 运行时验证。
  # UOS 20 兼容性由 build 任务对完整安装树施加的 ELF 符号上限门禁保证；发布前
  # 仍应在真实 UOS ARM64 环境安装候选包。
  verify-ubuntu2004:
    name: Smoke test in Ubuntu 20.04 userspace / arm64
    needs: build
    runs-on: ubuntu-22.04-arm
    container: ubuntu:20.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Install Ubuntu 20.04 runtime tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file
          test "$(dpkg --print-architecture)" = arm64
          grep -q '^VERSION_ID="20.04"$' /etc/os-release
          getconf GNU_LIBC_VERSION

      - uses: actions/download-artifact@v7
        with:
          name: dbeaver-ce-${{ env.DBEAVER_VERSION }}-arm64
          path: dist

      - name: Install package and verify runtime links
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          cd dist
          deb="dbeaver-ce_${DBEAVER_VERSION}_arm64.deb"
          sha256sum --check "$deb.sha256"
          # 用 dpkg 安装包本体，再让 apt-get -f install 根据 control 文件补齐 Depends。
          if ! dpkg -i "./$deb"; then
            apt-get install -y --no-install-recommends -f
          fi
          dpkg-query -W -f='${Status}\n' dbeaver-ce | grep -qx 'install ok installed'

          test "$(dpkg --print-architecture)" = arm64
          test -x /opt/dbeaver/dbeaver
          test -x /opt/dbeaver/jre/bin/java
          test -x /usr/bin/dbeaver
          test -f /usr/share/applications/dbeaver.desktop
          /opt/dbeaver/jre/bin/java -version

          # DBeaver 本身是 GUI，不在无 X server 的 CI 里启动；但检查所有 ELF
          # 启动器和 JNI 库，确保 Ubuntu 20.04 用户态中没有未解析的共享库。
          missing=0
          jre_library_path="/opt/dbeaver/jre/lib:/opt/dbeaver/jre/lib/server:/opt/dbeaver/jre/lib/jli"
          while IFS= read -r -d '' elf; do
            description="$(file "$elf")"
            if [[ "$description" == *ELF* ]]; then
              links_file="$(mktemp)"
              case "$elf" in
                /opt/dbeaver/jre/*)
                  if ! LD_LIBRARY_PATH="$jre_library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$elf" > "$links_file" 2>&1; then
                    echo "ldd failed for $elf" >&2
                    cat "$links_file" >&2
                    rm -f "$links_file"
                    missing=1
                    continue
                  fi
                  ;;
                *)
                  if ! ldd "$elf" > "$links_file" 2>&1; then
                    echo "ldd failed for $elf" >&2
                    cat "$links_file" >&2
                    rm -f "$links_file"
                    missing=1
                    continue
                  fi
                  ;;
              esac
              if grep -Eq "not found|undefined symbol|version [^ ]+ not found" "$links_file"; then
                echo "Unresolved dependencies, symbols, or symbol versions in $elf" >&2
                cat "$links_file" >&2
                missing=1
              fi
              rm -f "$links_file"
            fi
          done < <(find /opt/dbeaver -type f -print0)
          test "$missing" -eq 0

          grep -F 'Exec=/usr/bin/dbeaver %u' /usr/share/applications/dbeaver.desktop
          grep -F '/opt/dbeaver/jre/bin/java' /usr/bin/dbeaver
          dpkg-query -W -f='Status Architecture Version\n' dbeaver-ce
          cat /opt/dbeaver/BUILD-ENVIRONMENT.txt

  release:
    name: Publish GitHub Release
    needs: [build, verify-ubuntu2004]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Guard version tag
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          test "$tag" = "v${DBEAVER_VERSION}" || {
            echo "Tag $tag does not match DBeaver ${DBEAVER_VERSION}." >&2
            exit 1
          }

      - uses: actions/download-artifact@v7
        with:
          pattern: dbeaver-ce-${{ env.DBEAVER_VERSION }}-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ls -lh dist
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "DBeaver CE ${DBEAVER_VERSION}" \
              --notes "DBeaver CE ${DBEAVER_VERSION} ARM64 package targeting the UOS 20 ABI baseline.

            Includes a pinned official no-JDK input, a bundled Temurin 11 JRE,
            SHA-256 files, static ELF ABI ceiling checks, and an Ubuntu 20.04 userspace smoke test.
            Test the release candidate on real UOS 20 ARM64 before claiming runtime support."
          fi

  summary:
    name: Build summary
    needs: [build, verify-ubuntu2004]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## DBeaver ${DBEAVER_VERSION}"
            echo
            echo '| 项目 | 结果 |'
            echo '| --- | --- |'
            echo '| ARM64 装配 | ${{ needs.build.result }} |'
            echo '| Ubuntu 20.04 用户态冒烟 | ${{ needs.verify-ubuntu2004.result }} |'
            echo '| UOS 20 ABI 门禁 | 完整安装树的 GLIBC/GLIBCXX 静态上限检查 |'
            echo '| 输入 | 官方 nojdk 包 + 固定 Temurin 11 JRE（均校验 SHA-256） |'
          } >> "$GITHUB_STEP_SUMMARY"
